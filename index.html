<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>協会沖縄プロアマシリーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --bg-soft: #ebe6d9;
    --ink: #1a1614;
    --ink-soft: #4a4039;
    --ink-mute: #8a7e72;
    --line: #d4ccbc;
    --paper: #faf7f0;
    --accent: #8b1e1e;
    --accent-deep: #5a1414;
    --gold: #b8924a;
    --bamboo: #4a6b3a;
    --rank-1: #b8924a;
    --rank-2: #8a8a8a;
    --rank-3: #a87246;
    --rank-4: #4a4039;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-feature-settings: "palt";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(ellipse at top left, rgba(139, 30, 30, 0.04), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(74, 107, 58, 0.04), transparent 50%);
    min-height: 100vh;
  }
  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 32px 80px;
  }

  /* ==== Header ==== */
  header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 32px;
    align-items: end;
    padding-bottom: 32px;
    margin-bottom: 48px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  header::after {
    content: "";
    position: absolute;
    bottom: -4px; left: 0;
    width: 80px; height: 1px;
    background: var(--accent);
  }
  .logo-mark {
    width: 72px; height: 72px;
    border: 2px solid var(--ink);
    display: grid;
    place-items: center;
    font-family: 'Shippori Mincho', serif;
    font-size: 38px;
    font-weight: 800;
    background: var(--paper);
    box-shadow: 4px 4px 0 var(--accent);
  }
  .title-block h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: 0.04em;
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .title-block h1 .accent { color: var(--accent); }
  .title-block .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--ink-mute);
    text-transform: uppercase;
  }
  .meta-block {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    line-height: 1.8;
  }
  .meta-block .label { color: var(--ink-mute); }
  .meta-block .val { color: var(--ink); font-weight: 700; }

  /* ==== Source bar ==== */
  .source-bar {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 18px 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .source-bar .src-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--ink-mute);
    text-transform: uppercase;
    border-right: 1px solid var(--line);
    padding-right: 16px;
  }
  .source-bar input {
    flex: 1;
    min-width: 280px;
    border: none;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    padding: 6px 0;
    outline: none;
  }
  .source-bar input::placeholder { color: var(--ink-mute); }
  .source-bar button {
    background: var(--ink);
    color: var(--bg);
    border: none;
    padding: 10px 22px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.2s;
  }
  .source-bar button:hover { background: var(--accent); }
  .source-bar .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--bamboo);
  }
  .dedup-info {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 12px 24px;
    margin-bottom: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dedup-info .badge {
    background: var(--bamboo);
    color: var(--paper);
    padding: 2px 8px;
    font-weight: 700;
    letter-spacing: 0.15em;
    font-size: 10px;
  }
  .dedup-info .count { color: var(--accent); font-weight: 700; }

  /* ==== Progress bar ==== */
  .progress-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 40px;
  }
  .progress-step {
    flex: 1;
    padding: 14px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    text-align: center;
  }
  .progress-step.done {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .progress-step.current {
    background: var(--paper);
    border-color: var(--accent);
    border-width: 2px;
  }
  .progress-step .step-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    opacity: 0.7;
  }
  .progress-step .step-label {
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    font-weight: 700;
    margin-top: 4px;
  }
  .progress-step.done .step-label::before {
    content: "✓ ";
    color: var(--gold);
  }

  /* ==== Section ==== */
  section { margin-bottom: 64px; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 24px;
  }
  .section-head h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .section-head .en {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--ink-mute);
    text-transform: uppercase;
  }
  .section-head .rule {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ==== Stats overview ==== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 48px;
  }
  .stat-card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 24px;
  }
  .stat-card .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-mute);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .stat-card .stat-value {
    font-family: 'Shippori Mincho', serif;
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-card .stat-sub {
    font-size: 12px;
    color: var(--ink-mute);
    margin-top: 6px;
  }

  /* ==== Ranking table ==== */
  .ranking {
    background: var(--paper);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .ranking table {
    width: 100%;
    border-collapse: collapse;
  }
  .ranking th {
    text-align: left;
    padding: 16px 24px;
    background: var(--bg-soft);
    border-bottom: 2px solid var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    text-transform: uppercase;
    font-weight: 700;
  }
  .ranking th.num, .ranking td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ranking th.center, .ranking td.center { text-align: center; }
  .ranking td {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .ranking tr:last-child td { border-bottom: none; }
  .ranking tr.row:hover { background: var(--bg-soft); }
  .ranking .rank-cell {
    font-family: 'Shippori Mincho', serif;
    font-size: 22px;
    font-weight: 700;
    width: 80px;
    text-align: center;
  }
  .ranking .rank-1 { color: var(--rank-1); }
  .ranking .rank-2 { color: var(--rank-2); }
  .ranking .rank-3 { color: var(--rank-3); }
  .ranking .player-name {
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    font-weight: 700;
  }
  .ranking .player-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    margin-right: 8px;
  }
  .ranking .points {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
  }
  .ranking .points.pos { color: var(--bamboo); }
  .ranking .points.neg { color: var(--accent); }
  .ranking .games-mini {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    margin-left: 12px;
  }

  /* ==== Records list ==== */
  .round-group {
    border-bottom: 2px solid var(--ink);
    background: var(--paper);
  }
  .round-group:last-child { border-bottom: none; }
  .round-header {
    background: var(--ink);
    color: var(--bg);
    padding: 12px 24px;
    font-family: 'Shippori Mincho', serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .round-header .en {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .record-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 24px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .record-row:last-child { border-bottom: none; }
  .record-row:hover { background: var(--bg-soft); }
  .record-table {
    font-family: 'Shippori Mincho', serif;
    border-right: 1px solid var(--line);
    padding-right: 16px;
  }
  .record-table .num {
    display: block;
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
  }
  .record-table .label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-mute);
    margin-top: 4px;
    text-transform: uppercase;
  }
  .record-results {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .result-slot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg-soft);
    border-left: 3px solid var(--line);
  }
  .result-slot.r1 { border-left-color: var(--rank-1); background: rgba(184, 146, 74, 0.08); }
  .result-slot.r2 { border-left-color: var(--rank-2); }
  .result-slot.r3 { border-left-color: var(--rank-3); }
  .result-slot.r4 { border-left-color: var(--rank-4); }
  .result-rank {
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink-soft);
    width: 18px;
    text-align: center;
  }
  .result-slot.r1 .result-rank { color: var(--rank-1); }
  .result-info { flex: 1; min-width: 0; }
  .result-name {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-name .pn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    margin-right: 4px;
    font-weight: 400;
  }
  .result-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
  }
  .result-pt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
  }
  .result-pt.pos { color: var(--bamboo); }
  .result-pt.neg { color: var(--accent); }

  /* ==== Footer ==== */
  footer {
    margin-top: 80px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.15em;
  }

  /* ==== Responsive ==== */
  @media (max-width: 880px) {
    .container { padding: 32px 20px 60px; }
    header { grid-template-columns: auto 1fr; }
    .meta-block { display: none; }
    .title-block h1 { font-size: 24px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .ranking { overflow-x: auto; }
    .ranking table { min-width: 420px; }
    .record-results { grid-template-columns: repeat(2, 1fr); }
    .progress-bar { gap: 4px; }
    .progress-step { padding: 10px 6px; }
    .progress-step .step-label { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-mark">雀</div>
    <div class="title-block">
      <h1>協会沖縄<span class="accent">プロアマ</span>シリーズ</h1>
      <div class="subtitle">OKINAWA · PRO-AM · ONE-DAY TOURNAMENT</div>
    </div>
    <div class="meta-block">
      <div><span class="label">FORMAT</span> &nbsp; <span class="val">1day / 5半荘</span></div>
      <div><span class="label">UPD</span> &nbsp; <span class="val" id="lastUpdate">—</span></div>
    </div>
  </header>

  <div class="source-bar">
    <div class="src-label">RESULTS</div>
    <input type="text" id="sheetUrl" placeholder="「結果」シートのURL（空欄ならサンプルデータを表示）">
    <button onclick="loadData()">読込</button>
  </div>
  <div class="source-bar">
    <div class="src-label">PLAYERS</div>
    <input type="text" id="masterUrl" placeholder="「選手マスタ」シートのURL（任意・選手番号→名前の変換に使用）">
    <span class="status" id="status">● サンプルデータ表示中</span>
  </div>

  <div class="dedup-info">
    <span class="badge">AUTO DEDUP</span>
    <span>同一ラウンド×卓番号は最新のタイムスタンプを採用 ／ <span class="count" id="dedupCount">0</span> 件の重複行をフィルタしました</span>
  </div>

  <div class="progress-bar" id="progressBar"></div>

  <section>
    <div class="section-head">
      <h2>概況</h2>
      <span class="en">OVERVIEW</span>
      <div class="rule"></div>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>順位表</h2>
      <span class="en">RANKING</span>
      <div class="rule"></div>
    </div>
    <div class="ranking">
      <table>
        <thead>
          <tr>
            <th class="center">順位</th>
            <th>プレイヤー</th>
            <th class="num">累計pt</th>
          </tr>
        </thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>対局結果</h2>
      <span class="en">RESULTS</span>
      <div class="rule"></div>
    </div>
    <div id="recordsList"></div>
  </section>

  <footer>
    <div>© 協会沖縄プロアマシリーズ</div>
    <div id="dataInfo">SAMPLE DATA</div>
  </footer>
</div>

<script>
  // ============================================================
  // 1day大会 / 5半荘 / Googleフォーム入力対応版
  //
  // 【スプレッドシート構成】
  //  シート1「結果」: フォーム送信の生データ + VLOOKUPで選手名を解決
  //   timestamp, round, table, p1_num, p1_name, p1_score,
  //                            p2_num, p2_name, p2_score,
  //                            p3_num, p3_name, p3_score,
  //                            p4_num, p4_name, p4_score
  //   (p*_name 列は =VLOOKUP(p*_num, 選手マスタ!A:B, 2, FALSE) を入れる)
  //
  //  シート2「選手マスタ」: A列=選手番号, B列=選手名
  //
  // 【再送信処理】
  //  (round, table)が同じ行が複数ある場合、timestamp が最新の行だけを採用。
  // ============================================================
  const TOTAL_ROUNDS = 5;

  // サンプルデータ生成 (40人/10卓×5半荘, 選手番号付き, 一部に重複再送信を仕込む)
  const POOL = [
    '比嘉','金城','大城','宮城','上原','新垣','玉城','島袋',
    '仲宗根','山田','照屋','當間','与那覇','安里','謝花','宮里',
    '長嶺','仲井真','屋良','石川','糸数','古堅','名嘉','喜納',
    '渡嘉敷','瑞慶覧','東江','内間','瀬底','平良','友寄','古謝',
    '神谷','宜野座','親泊','嘉手納','久高','津堅','伊是名','粟国'
  ];
  const PLAYER_MASTER = POOL.map((name, i) => ({ num: 101 + i, name }));

  function generateSampleRows() {
    const rows = [];
    let seed = 42;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    let timestamp = new Date('2025-05-24T10:00:00').getTime();

    const completedRounds = 4;
    for (let r = 1; r <= completedRounds; r++) {
      const shuffled = [...PLAYER_MASTER].sort(() => rand() - 0.5);
      for (let t = 1; t <= 10; t++) {
        const picked = shuffled.slice((t-1) * 4, t * 4);
        let scores = [
          25000 + Math.floor(rand() * 25000),
          25000 + Math.floor(rand() * 10000) - 5000,
          25000 - Math.floor(rand() * 10000),
          25000 - Math.floor(rand() * 20000),
        ];
        const sum = scores.reduce((s, v) => s + v, 0);
        scores[0] += (100000 - sum);
        scores = scores.map(s => Math.round(s / 100) * 100);
        const diff = 100000 - scores.reduce((s, v) => s + v, 0);
        scores[0] += diff;

        timestamp += 60000 + Math.floor(rand() * 120000);
        rows.push({
          timestamp,
          round: r,
          table: t,
          players: picked.map((p, i) => ({ num: p.num, name: p.name, score: scores[i] }))
        });
      }
    }
    // 入力ミス再送信のシミュレーション:
    // round=2/table=3 と round=3/table=7 を別の(訂正)送信で上書き
    const fixTargets = [{ r: 2, t: 3 }, { r: 3, t: 7 }];
    fixTargets.forEach(({ r, t }) => {
      const orig = rows.find(x => x.round === r && x.table === t);
      if (!orig) return;
      timestamp += 30000;
      const corrected = {
        timestamp,
        round: r,
        table: t,
        players: orig.players.map((p, i) => ({
          ...p,
          // 正しい点数 (小さな修正としてバラつかせる)
          score: p.score + (i === 0 ? 1000 : i === 3 ? -1000 : 0)
        }))
      };
      rows.push(corrected);
    });
    return rows;
  }
  const SAMPLE_ROWS = generateSampleRows();

  // ウマ・オカ
  const UMA = [30, 10, -10, -30];
  const RETURN_PT = 30000;
  const ORIGIN_PT = 25000;

  function calcPoints(playersSortedByScoreDesc) {
    return playersSortedByScoreDesc.map((p, i) => {
      let pt = (p.score - RETURN_PT) / 1000 + UMA[i];
      if (i === 0) pt += (RETURN_PT - ORIGIN_PT) * 4 / 1000;
      return { ...p, rank: i + 1, pt: Math.round(pt * 10) / 10 };
    });
  }

  // 重複行を除外: (round, table) ごとに最新タイムスタンプの1行のみ採用
  function dedupRows(rows) {
    const map = new Map();
    let dropped = 0;
    rows.forEach(row => {
      const key = `${row.round}-${row.table}`;
      const existing = map.get(key);
      if (!existing) {
        map.set(key, row);
      } else if (row.timestamp > existing.timestamp) {
        map.set(key, row);
        dropped += 1;
      } else {
        dropped += 1;
      }
    });
    return { rows: Array.from(map.values()), dropped };
  }

  let allRows = [];
  let dropCount = 0;

  function processData(rows) {
    return rows.map(row => ({
      round: row.round,
      table: row.table,
      timestamp: row.timestamp,
      results: calcPoints([...row.players].sort((a, b) => b.score - a.score))
    })).sort((a, b) => a.round - b.round || a.table - b.table);
  }

  function aggregatePlayers(games) {
    const map = {};
    games.forEach(g => g.results.forEach(r => {
      const key = r.num || r.name;
      if (!map[key]) map[key] = { num: r.num, name: r.name, totalPt: 0, games: 0 };
      map[key].totalPt += r.pt;
      map[key].games += 1;
    }));
    return Object.values(map).map(p => ({
      ...p,
      totalPt: Math.round(p.totalPt * 10) / 10
    })).sort((a, b) => b.totalPt - a.totalPt);
  }

  function renderProgress(games) {
    const playedRounds = new Set(games.map(g => g.round));
    const maxPlayed = playedRounds.size > 0 ? Math.max(...playedRounds) : 0;
    document.getElementById('progressBar').innerHTML =
      Array.from({length: TOTAL_ROUNDS}, (_, i) => {
        const r = i + 1;
        const done = playedRounds.has(r);
        const current = r === maxPlayed + 1;
        const cls = done ? 'done' : (current ? 'current' : '');
        return `
          <div class="progress-step ${cls}">
            <div class="step-num">ROUND ${r}</div>
            <div class="step-label">${r}半荘目</div>
          </div>
        `;
      }).join('');
  }

  function renderStats(games, players) {
    const playedRounds = new Set(games.map(g => g.round)).size;
    const totalPlayers = players.length;
    const topPlayer = players[0];
    const totalTables = games.length;

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card">
        <div class="stat-label">PROGRESS</div>
        <div class="stat-value">${playedRounds}<span style="font-size:18px;color:var(--ink-mute);"> / ${TOTAL_ROUNDS}</span></div>
        <div class="stat-sub">半荘完了</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PLAYERS</div>
        <div class="stat-value">${totalPlayers}</div>
        <div class="stat-sub">参加人数</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">TABLES</div>
        <div class="stat-value">${totalTables}</div>
        <div class="stat-sub">総卓数</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">LEADER</div>
        <div class="stat-value" style="font-size:26px;">${topPlayer ? topPlayer.name : '—'}</div>
        <div class="stat-sub">${topPlayer ? ((topPlayer.totalPt > 0 ? '+' : '') + topPlayer.totalPt + ' pt') : '—'}</div>
      </div>
    `;
  }

  function renderRanking(players) {
    document.getElementById('rankingBody').innerHTML = players.map((p, i) => {
      const rank = i + 1;
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      const ptClass = p.totalPt >= 0 ? 'pos' : 'neg';
      const ptStr = (p.totalPt > 0 ? '+' : '') + p.totalPt.toFixed(1);
      const numTag = p.num ? `<span class="player-num">#${p.num}</span>` : '';
      return `
        <tr class="row">
          <td class="rank-cell ${rankClass}">${rank}</td>
          <td>
            ${numTag}<span class="player-name">${p.name}</span>
            <span class="games-mini">${p.games}半荘</span>
          </td>
          <td class="num"><span class="points ${ptClass}">${ptStr}</span></td>
        </tr>
      `;
    }).join('');
  }

  function renderRecords(games) {
    const byRound = {};
    games.forEach(g => {
      if (!byRound[g.round]) byRound[g.round] = [];
      byRound[g.round].push(g);
    });
    const rounds = Object.keys(byRound).map(Number).sort((a, b) => a - b);

    document.getElementById('recordsList').innerHTML = rounds.map(r => {
      const tables = byRound[r].sort((a, b) => a.table - b.table);
      return `
        <div class="round-group">
          <div class="round-header">
            <span>${r}半荘目</span>
            <span class="en">ROUND ${r} · ${tables.length} TABLES</span>
          </div>
          ${tables.map(g => `
            <div class="record-row">
              <div class="record-table">
                <span class="num">${g.table}</span>
                <span class="label">TABLE</span>
              </div>
              <div class="record-results">
                ${g.results.map(rr => {
                  const ptClass = rr.pt >= 0 ? 'pos' : 'neg';
                  const ptStr = (rr.pt > 0 ? '+' : '') + rr.pt.toFixed(1);
                  const numTag = rr.num ? `<span class="pn">#${rr.num}</span>` : '';
                  return `
                    <div class="result-slot r${rr.rank}">
                      <div class="result-rank">${rr.rank}</div>
                      <div class="result-info">
                        <div class="result-name">${numTag}${rr.name}</div>
                        <div class="result-score">${rr.score.toLocaleString()}</div>
                      </div>
                      <div class="result-pt ${ptClass}">${ptStr}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  }

  function render() {
    const { rows: deduped, dropped } = dedupRows(allRows);
    const games = processData(deduped);
    const players = aggregatePlayers(games);
    document.getElementById('dedupCount').textContent = dropped;
    renderProgress(games);
    renderStats(games, players);
    renderRanking(players);
    renderRecords(games);
    document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('ja-JP');
  }

  // ============================================================
  // CSV読み込み
  //
  // ▼ 「結果」シート (フォーム送信そのまま、11列):
  //    timestamp, round, table,
  //    p1_num, p1_score, p2_num, p2_score, p3_num, p3_score, p4_num, p4_score
  //
  // ▼ 「選手マスタ」シート (任意、2列):
  //    選手番号, 選手名
  //
  // 選手マスタを読み込んでおけば、結果シートの選手番号→選手名に自動変換します。
  // 選手マスタ未設定/未登録番号の場合は「#101」のように番号がそのまま表示されます。
  // ============================================================

  // ▼▼▼ ここに自分のスプレッドシートURLを貼り付けてください ▼▼▼
  // 空のままだとサンプルデータが表示されます。
  // URLが入っていれば、サイトを開いたときに自動で読み込みます。
  const DEFAULT_RESULTS_URL = "https://docs.google.com/spreadsheets/d/1MkIc19F2c8uYXfIfsnUioc7V1nzk5tW0lG6ZZgTpeWo/edit?resourcekey=&gid=369823880#gid=369823880";
  const DEFAULT_MASTER_URL  = "https://docs.google.com/spreadsheets/d/1MkIc19F2c8uYXfIfsnUioc7V1nzk5tW0lG6ZZgTpeWo/edit?resourcekey=&gid=1921803685#gid=1921803685";
  // ▲▲▲ ここまで ▲▲▲

  // 自動更新の間隔(ミリ秒)。0にすると自動更新オフ。
  const AUTO_REFRESH_MS = 30000; // 30秒

  let playerMaster = {}; // { 101: '比嘉', 102: '金城', ... }
  let autoRefreshTimer = null;

  // サンプル用の選手マスタを初期セット
  PLAYER_MASTER.forEach(p => { playerMaster[p.num] = p.name; });

  function buildCsvUrl(url) {
    const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if (!m) return url;
    const id = m[1];
    const gidMatch = url.match(/[?&#]gid=(\d+)/);
    const gid = gidMatch ? gidMatch[1] : '0';
    return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
  }

  async function loadData(silent = false) {
    const url = document.getElementById('sheetUrl').value.trim();
    const masterUrl = document.getElementById('masterUrl').value.trim();
    const status = document.getElementById('status');

    if (!url) {
      // サンプルデータ表示
      PLAYER_MASTER.forEach(p => { playerMaster[p.num] = p.name; });
      allRows = SAMPLE_ROWS;
      status.textContent = '● サンプルデータ表示中';
      status.style.color = 'var(--ink-mute)';
      document.getElementById('dataInfo').textContent = 'SAMPLE DATA';
      render();
      stopAutoRefresh();
      return;
    }

    try {
      if (!silent) status.textContent = '○ 読込中...';

      // 選手マスタを先に読み込む(指定があれば)
      if (masterUrl) {
        const masterRes = await fetch(buildCsvUrl(masterUrl) + '&_=' + Date.now());
        if (!masterRes.ok) throw new Error('選手マスタ読込失敗 (' + masterRes.status + ')');
        const masterText = await masterRes.text();
        playerMaster = parseMasterCSV(masterText);
      } else if (Object.keys(playerMaster).length === 0) {
        playerMaster = {};
      }

      // 結果シートを読み込む(キャッシュ回避のためタイムスタンプ付与)
      const res = await fetch(buildCsvUrl(url) + '&_=' + Date.now());
      if (!res.ok) throw new Error('結果読込失敗 (' + res.status + ')');
      const text = await res.text();
      allRows = parseCSV(text);

      const masterCount = Object.keys(playerMaster).length;
      const masterInfo = masterCount > 0 ? ` / 選手マスタ ${masterCount}名` : '';
      const refreshInfo = AUTO_REFRESH_MS > 0 ? ' / 自動更新ON' : '';
      const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      status.textContent = `● 更新 ${now} (${allRows.length}行${masterInfo})${refreshInfo}`;
      status.style.color = 'var(--bamboo)';
      document.getElementById('dataInfo').textContent = 'GOOGLE SHEETS · ' + allRows.length + ' ROWS';
      render();
      startAutoRefresh();
    } catch (e) {
      status.textContent = '✕ ' + e.message;
      status.style.color = 'var(--accent)';
    }
  }

  function startAutoRefresh() {
    if (AUTO_REFRESH_MS <= 0) return;
    stopAutoRefresh();
    autoRefreshTimer = setInterval(() => loadData(true), AUTO_REFRESH_MS);
  }

  function stopAutoRefresh() {
    if (autoRefreshTimer) {
      clearInterval(autoRefreshTimer);
      autoRefreshTimer = null;
    }
  }

  // 選手マスタCSVをパース: 1列目=番号、2列目=名前
  function parseMasterCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const map = {};
    for (let i = 1; i < lines.length; i++) { // 1行目はヘッダー想定
      const cols = lines[i].split(',').map(s => s.trim());
      if (cols.length < 2) continue;
      const num = parseInt(cols[0]);
      const name = cols[1];
      if (!isNaN(num) && name) map[num] = name;
    }
    return map;
  }

  // 結果CSVをパース: フォーム送信形式の11列 (timestamp/round/table/4人分の番号+点数)
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(s => s.trim());
      if (cols.length < 11) continue;
      const round = parseInt(cols[1]);
      const table = parseInt(cols[2]);
      if (!round || !table) continue;
      const players = [];
      let valid = true;
      for (let p = 0; p < 4; p++) {
        // p1: cols[3,4], p2: cols[5,6], p3: cols[7,8], p4: cols[9,10]
        const base = 3 + p * 2;
        const num = parseInt(cols[base]);
        const score = parseInt(cols[base + 1]);
        if (isNaN(num) || isNaN(score)) { valid = false; break; }
        // 選手マスタから名前を解決(なければ番号をそのまま表示)
        const name = playerMaster[num] || `#${num}`;
        players.push({ num, name, score });
      }
      if (!valid) continue;
      const tsRaw = cols[0];
      const ts = Date.parse(tsRaw);
      rows.push({
        timestamp: isNaN(ts) ? i : ts,
        round, table, players
      });
    }
    return rows;
  }

  // 初期表示: デフォルトURLが設定されていれば自動読込、なければサンプル表示
  if (DEFAULT_RESULTS_URL) {
    document.getElementById('sheetUrl').value = DEFAULT_RESULTS_URL;
    document.getElementById('masterUrl').value = DEFAULT_MASTER_URL;
    loadData();
  } else {
    allRows = SAMPLE_ROWS;
    render();
  }
</script>
</body>
</html>
