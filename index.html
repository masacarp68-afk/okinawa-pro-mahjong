<!DOCTYPE html>
<!--
================================================================
協会沖縄プロアマシリーズ 成績表
================================================================

【ベース】麻雀大会 成績表テンプレート
【機能】
 - 順位表(未対局選手も表示)
 - 個人ページで「今日の卓組み」表示 (1回戦 → ○卓 / 2回戦 → ○卓 ...)
 - 対局履歴・成績統計
 - 5分ごとの自動更新

【選手マスタスプシの構成】
 A列: 選手番号
 B列: 選手名
 C列以降: 1回戦卓番 / 2回戦卓番 / 3回戦卓番 ...
 ※ 回戦は必要な分だけ増やしてOK

【共有設定】
両方のスプシとも「リンクを知っている全員 - 閲覧者」に設定してください。

================================================================
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>協会沖縄プロアマシリーズ 成績表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec;              /* 少し暖かみのある白ベージュ(和紙感) */
    --bg-soft: #ebe6dc;
    --ink: #1a1a1a;             /* ロゴに近い深い黒 */
    --ink-soft: #3d3833;
    --ink-mute: #8a827a;
    --line: #ddd7ca;
    --paper: #ffffff;
    --accent: #d0021b;          /* ロゴの牌の赤 */
    --accent-deep: #a00114;
    --accent-soft: #ffdbde;
    --gold: #c4a153;            /* 落ち着いたゴールド(1位表彰用) */
    --bamboo: #5f7a55;          /* 深緑寄り(競技会場の雰囲気) */
    --sky: #4a6785;             /* 落ち着いた青 */
    --pink: #d97a8b;
    --rank-1: #c4a153;          /* 金 */
    --rank-2: #7f7f7f;          /* 銀(グレー) */
    --rank-3: #a06635;          /* 銅 */
    --rank-4: #4a4239;          /* 深墨 */
    --shadow: 6px 6px 0 rgba(26, 26, 26, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-feature-settings: "palt";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(circle at 15% 20%, rgba(208, 2, 27, 0.06), transparent 35%),
      radial-gradient(circle at 85% 80%, rgba(26, 26, 26, 0.05), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(196, 161, 83, 0.05), transparent 60%);
    min-height: 100vh;
  }
  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 32px 80px;
  }
  a { color: inherit; text-decoration: none; }

  /* ==== Header ==== */
  header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 32px;
    align-items: end;
    padding-bottom: 28px;
    margin-bottom: 32px;
    border-bottom: 2px dashed var(--line);
    position: relative;
  }
  header::after {
    content: "";
    position: absolute;
    bottom: -5px; left: 0;
    width: 120px; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--ink));
    border-radius: 2px;
  }
  .logo-mark {
    width: 72px; height: 72px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: #ffffff;
    box-shadow: var(--shadow);
    cursor: pointer;
    transform: rotate(-2deg);
    transition: transform 0.15s ease;
    overflow: hidden;
    padding: 4px;
  }
  .logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .logo-mark:hover { transform: rotate(0deg) scale(1.05); }
  .title-block h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.02em;
    line-height: 1.15;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .title-block h1 .accent {
    color: var(--accent);
    position: relative;
    display: inline-block;
  }
  .title-block h1 .accent::after {
    content: "";
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 6px;
    background: var(--accent);
    opacity: 0.25;
    z-index: -1;
    border-radius: 3px;
  }
  .title-block .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--ink-mute);
    text-transform: uppercase;
  }
  .meta-block {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    line-height: 1.8;
  }
  .meta-block .label { color: var(--ink-mute); }
  .meta-block .val { color: var(--ink); font-weight: 700; }

  /* ==== Two-column layout ==== */
  .two-col {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
    margin-bottom: 56px;
  }
  .two-col section { margin-bottom: 0; }

  /* ==== Today's results (side column) ==== */
  .today-list {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .today-item {
    padding: 14px 16px;
    border-bottom: 1px dashed var(--line);
  }
  .today-item:last-child { border-bottom: none; }
  .today-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.1em;
  }
  .today-item-num {
    font-family: 'Shippori Mincho', serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--accent);
  }
  .today-mini-list {
    display: grid;
    gap: 6px;
  }
  .today-mini-row {
    display: grid;
    grid-template-columns: 22px 1fr auto auto;
    gap: 8px;
    align-items: center;
    padding: 5px 8px;
    background: var(--bg-soft);
    border-radius: 8px;
    border-left: 3px solid var(--line);
    font-size: 12px;
  }
  .today-mini-row.r1 { border-left-color: var(--gold); background: rgba(240, 185, 66, 0.10); }
  .today-mini-row.r2 { border-left-color: var(--sky); background: rgba(90, 180, 214, 0.06); }
  .today-mini-row.r3 { border-left-color: var(--rank-3); background: rgba(217, 127, 76, 0.06); }
  .today-mini-row.r4 { border-left-color: var(--rank-4); }
  .today-mini-rank {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    text-align: center;
    color: var(--ink-soft);
  }
  .today-mini-row.r1 .today-mini-rank { color: var(--rank-1); }
  .today-mini-name {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .today-mini-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
  }
  .today-mini-pt {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 12px;
  }
  .today-mini-pt.pos { color: var(--bamboo); }
  .today-mini-pt.neg { color: var(--accent); }

  @media (max-width: 980px) {
    .two-col { grid-template-columns: 1fr; gap: 32px; }
  }
  .period-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    overflow-x: auto;
    flex-wrap: nowrap;
    padding: 4px;
  }
  .period-chip {
    padding: 10px 18px;
    font-family: 'Shippori Mincho', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 14px;
  }
  .period-chip:hover {
    background: var(--bg-soft);
    transform: translateY(-2px);
    border-color: var(--gold);
  }
  .period-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 3px 0 var(--accent-deep);
  }
  .period-chip .en {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--ink-mute);
    margin-bottom: 2px;
  }
  .period-chip.active .en { color: rgba(255, 255, 255, 0.7); }

  /* ==== Status / source bar ==== */
  .source-bar {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }
  .source-bar .src-label {
    color: var(--ink-mute);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-right: 2px dashed var(--line);
    padding-right: 12px;
  }
  .source-bar input {
    flex: 1;
    min-width: 200px;
    border: none;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    outline: none;
  }
  .source-bar button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 18px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 2px 0 var(--accent-deep);
    transition: transform 0.1s;
  }
  .source-bar button:hover { transform: translateY(-1px); }
  .source-bar button:active { transform: translateY(1px); box-shadow: none; }
  .source-bar .status { color: var(--bamboo); font-weight: 700; }
  .source-bar .toggle-src {
    color: var(--ink-mute);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    margin-left: auto;
  }
  .source-detail { display: none; }
  .source-detail.visible { display: flex; }

  /* ==== Section ==== */
  section { margin-bottom: 56px; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 20px;
  }
  .section-head h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .section-head .en {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--ink-mute);
    text-transform: uppercase;
  }
  .section-head .rule {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ==== Stats overview ==== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 40px;
  }
  .stat-card {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    position: relative;
    transition: transform 0.15s;
  }
  .stat-card:hover {
    transform: translateY(-3px);
  }
  .stat-card:nth-child(1) { border-top: 5px solid var(--gold); }
  .stat-card:nth-child(2) { border-top: 5px solid var(--sky); }
  .stat-card:nth-child(3) { border-top: 5px solid var(--bamboo); }
  .stat-card:nth-child(4) { border-top: 5px solid var(--accent); }
  .stat-card .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-mute);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .stat-card .stat-value {
    font-family: 'Shippori Mincho', serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-card .stat-sub {
    font-size: 11px;
    color: var(--ink-mute);
    margin-top: 6px;
  }

  /* ==== Ranking table ==== */
  .ranking {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .ranking table {
    width: 100%;
    border-collapse: collapse;
  }
  .ranking th {
    text-align: left;
    padding: 14px 20px;
    background: var(--bg-soft);
    border-bottom: 3px solid var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    text-transform: uppercase;
    font-weight: 700;
  }
  .ranking th.num, .ranking td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ranking th.center, .ranking td.center { text-align: center; }
  .ranking td {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .ranking tr:last-child td { border-bottom: none; }
  .ranking tr.row { cursor: pointer; transition: background 0.1s; }
  .ranking tr.row:hover { background: var(--bg-soft); }
  .ranking tr.row:hover .player-name { color: var(--accent); }
  .ranking .rank-cell {
    font-family: 'Shippori Mincho', serif;
    font-size: 20px;
    font-weight: 700;
    width: 70px;
    text-align: center;
  }
  .ranking .rank-1 { color: var(--rank-1); }
  .ranking .rank-2 { color: var(--rank-2); }
  .ranking .rank-3 { color: var(--rank-3); }
  .ranking .player-name {
    font-family: 'Shippori Mincho', serif;
    font-size: 17px;
    font-weight: 700;
    transition: color 0.15s;
  }
  .ranking .player-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    margin-right: 8px;
  }
  .ranking .points {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
  }
  .ranking .points.pos { color: var(--bamboo); }
  .ranking .points.neg { color: var(--accent); }
  .ranking .games-mini {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    margin-left: 10px;
  }
  .ranking .rank-dist {
    display: inline-flex;
    gap: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }
  .ranking .rank-dist span {
    background: var(--bg-soft);
    padding: 3px 9px;
    color: var(--ink-soft);
    border-radius: 10px;
    font-weight: 700;
  }
  .ranking .arrow-link {
    color: var(--ink-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
  }

  /* ==== Recent results ==== */
  .records {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .record-row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 24px;
    padding: 18px 20px;
    border-bottom: 1px dashed var(--line);
    align-items: center;
  }
  .record-row:last-child { border-bottom: none; }
  .record-row:hover { background: var(--bg-soft); }
  .record-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    line-height: 1.6;
    border-right: 2px dashed var(--line);
    padding-right: 14px;
  }
  .record-time .date { display: block; font-size: 14px; color: var(--ink); font-weight: 700; }
  .record-results {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .result-slot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg-soft);
    border-left: 4px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .result-slot:hover { transform: translateY(-2px); }
  .result-slot.r1 { border-left-color: var(--gold); background: rgba(240, 185, 66, 0.12); }
  .result-slot.r2 { border-left-color: var(--sky); background: rgba(90, 180, 214, 0.08); }
  .result-slot.r3 { border-left-color: var(--rank-3); background: rgba(217, 127, 76, 0.08); }
  .result-slot.r4 { border-left-color: var(--rank-4); }
  .result-rank {
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink-soft);
    width: 18px;
    text-align: center;
  }
  .result-slot.r1 .result-rank { color: var(--rank-1); }
  .result-info { flex: 1; min-width: 0; }
  .result-name {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-name .pn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    margin-right: 4px;
    font-weight: 400;
  }
  .result-name .seat-tag {
    display: inline-block;
    font-family: 'Shippori Mincho', serif;
    font-size: 10px;
    background: var(--ink);
    color: var(--gold);
    padding: 1px 5px;
    border-radius: 4px;
    margin-right: 4px;
    font-weight: 700;
    vertical-align: middle;
  }
  .result-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
  }
  .result-pt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
  }
  .result-pt.pos { color: var(--bamboo); }
  .result-pt.neg { color: var(--accent); }

  /* ==== Unplayed rows ==== */
  .row-unplayed {
    opacity: 0.55;
    background: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(0,0,0,0.02) 6px, rgba(0,0,0,0.02) 12px);
  }
  .row-unplayed:hover { opacity: 0.9; }
  .row-unplayed .rank-cell.rank-none {
    color: var(--ink-mute);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
  }
  .row-unplayed .games-mini {
    background: var(--line);
    color: var(--ink-mute);
  }

  /* ==== Player tables (today's tables) ==== */
  .tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 20px;
  }
  .table-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px 8px;
    background: var(--bg-soft);
    border-radius: 14px;
    border: 2px solid var(--line);
    position: relative;
    transition: transform 0.15s;
  }
  .table-slot:hover { transform: translateY(-2px); }
  .table-slot .round-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--ink-mute);
    text-transform: uppercase;
  }
  .table-slot .round-jp {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .table-slot .table-num {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1;
    color: var(--accent);
    margin-top: 2px;
  }
  .table-slot .table-num-suffix {
    font-family: 'Shippori Mincho', serif;
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .table-slot.done {
    background: rgba(95, 168, 63, 0.08);
    border-color: var(--bamboo);
  }
  .table-slot.done::after {
    content: "済";
    position: absolute;
    top: 6px;
    right: 6px;
    font-family: 'Shippori Mincho', serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--bamboo);
    background: white;
    padding: 2px 6px;
    border-radius: 6px;
    border: 1px solid var(--bamboo);
  }
  .table-slot.pending {
    opacity: 0.6;
  }
  .tables-empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--ink-mute);
    font-family: 'Shippori Mincho', serif;
    font-size: 14px;
    background: var(--paper);
    border: 2px dashed var(--line);
    border-radius: 18px;
  }

  /* ==== Player page ==== */
  .player-header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 32px;
    align-items: center;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 24px;
    padding: 32px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .player-header::before {
    content: "";
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    border-radius: 50%;
    z-index: 0;
  }
  .player-header > * { position: relative; z-index: 1; }
  .player-avatar {
    width: 96px; height: 96px;
    border: 3px solid var(--ink);
    background: var(--gold);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: 'Shippori Mincho', serif;
    font-size: 44px;
    font-weight: 800;
    box-shadow: var(--shadow);
    color: var(--ink);
  }
  .player-headline h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .player-headline .pn-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--ink-mute);
    text-transform: uppercase;
  }
  .player-headline .pt-summary {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    margin-top: 12px;
  }
  .player-headline .pt-summary.pos { color: var(--bamboo); }
  .player-headline .pt-summary.neg { color: var(--accent); }
  .back-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--ink-mute);
    text-transform: uppercase;
    cursor: pointer;
    align-self: start;
  }
  .back-link:hover { color: var(--accent); }

  /* ==== Player stats grid ==== */
  .player-stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }
  .player-stat {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    transition: transform 0.15s;
  }
  .player-stat:hover { transform: translateY(-3px); }
  .player-stat .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--ink-mute);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .player-stat .value {
    font-family: 'Shippori Mincho', serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .player-stat .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    margin-top: 4px;
  }
  .player-stat.r1 .value { color: var(--rank-1); }
  .player-stat.r2 .value { color: var(--rank-2); }
  .player-stat.r3 .value { color: var(--rank-3); }
  .player-stat.r4 .value { color: var(--rank-4); }
  .player-stat.best .value { color: var(--bamboo); }
  .player-stat.worst .value { color: var(--accent); }

  /* ==== Chart ==== */
  .chart-wrap {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 40px;
  }
  .chart-wrap svg { width: 100%; height: auto; display: block; }

  /* ==== Footer ==== */
  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.15em;
  }

  /* ==== Empty state ==== */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    font-family: 'Shippori Mincho', serif;
    color: var(--ink-mute);
    background: var(--paper);
    border: 2px dashed var(--line);
    border-radius: 18px;
  }
  .empty-state .emoji { font-size: 36px; margin-bottom: 12px; opacity: 0.6; }

  /* ==== Responsive ==== */
  @media (max-width: 880px) {
    .container { padding: 28px 16px 56px; }
    header { grid-template-columns: auto 1fr; gap: 16px; }
    .meta-block { display: none; }
    .title-block h1 { font-size: 22px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .ranking { overflow-x: auto; }
    .ranking table { min-width: 600px; }
    .record-results { grid-template-columns: repeat(2, 1fr); }
    .player-header { grid-template-columns: auto 1fr; padding: 20px; gap: 16px; }
    .player-avatar { width: 64px; height: 64px; font-size: 28px; }
    .player-headline h2 { font-size: 24px; }
    .player-headline .pt-summary { font-size: 18px; }
    .back-link { grid-column: 1 / -1; }
    .player-stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const seatNames = ['東', '南', '西', '北'];

  // 1day大会: 今日、5半荘 × 4卓 = 20対局
  const today = new Date();
  today.setHours(10, 0, 0, 0); // 10時スタート

  const tables = 4;
  const hanchanCount = 5;

  for (let h = 0; h < hanchanCount; h++) {
    for (let t = 0; t < tables; t++) {
      const ts = new Date(today);
      ts.setHours(10 + h * 2, t * 15 + Math.floor(rand() * 10));

      const shuffled = [...PLAYER_MASTER_SAMPLE].sort(() => rand() - 0.5);
      const picked = shuffled.slice(t * 4, t * 4 + 4);
      if (picked.length < 4) continue; // プレイヤー数が足りなければスキップ

      let scores = [
        25000 + Math.floor(rand() * 25000),
        25000 + Math.floor(rand() * 10000) - 5000,
        25000 - Math.floor(rand() * 10000),
        25000 - Math.floor(rand() * 20000),
      ];
      const sum = scores.reduce((s, v) => s + v, 0);
      scores[0] += (100000 - sum);
      scores = scores.map(s => Math.round(s / 100) * 100);
      const diff = 100000 - scores.reduce((s, v) => s + v, 0);
      scores[0] += diff;

      const playerScorePairs = picked.map((p, i) => ({ player: p, score: scores[i] }));
      playerScorePairs.sort(() => rand() - 0.5);
      rows.push({
        timestamp: ts.getTime(),
        gameDate: ts.getTime(),
        players: playerScorePairs.map((pair, i) => ({
          num: pair.player.num,
          name: pair.player.name,
          score: pair.score,
          seat: seatNames[i]
        }))
      });
    }
  }
  return rows;
}

// ============================================================
// ポイント計算(同点ウマオカ山分け対応)
// ============================================================
function calcPoints(playersSortedByScoreDesc) {
  const n = playersSortedByScoreDesc.length;
  const groups = [];
  let i = 0;
  while (i < n) {
    let j = i;
    while (j + 1 < n && playersSortedByScoreDesc[j + 1].score === playersSortedByScoreDesc[i].score) j++;
    groups.push({
      indices: Array.from({length: j - i + 1}, (_, k) => i + k),
      startRank: i + 1,
      endRank: j + 1
    });
    i = j + 1;
  }
  const okaTotal = (RETURN_PT - ORIGIN_PT) * 4 / 1000;
  return playersSortedByScoreDesc.map((p, idx) => {
    const group = groups.find(g => g.indices.includes(idx));
    const groupSize = group.indices.length;
    let umaSum = 0;
    for (let r = group.startRank; r <= group.endRank; r++) umaSum += UMA[r - 1];
    const umaAvg = umaSum / groupSize;
    let okaShare = 0;
    if (group.startRank === 1) okaShare = okaTotal / groupSize;
    const pt = (p.score - RETURN_PT) / 1000 + umaAvg + okaShare;
    return { ...p, rank: group.startRank, pt: Math.round(pt * 10) / 10 };
  });
}

function processRows(rows) {
  return rows.map(row => ({
    timestamp: row.timestamp,
    gameDate: row.gameDate || row.timestamp,
    results: calcPoints([...row.players].sort((a, b) => b.score - a.score))
  })).sort((a, b) => b.timestamp - a.timestamp);
}

function aggregatePlayers(games) {
  const map = {};

  // まず選手マスタの全員を pt=0, games=0 で初期化
  Object.keys(playerMaster).forEach(numStr => {
    const num = parseInt(numStr);
    if (!isNaN(num)) {
      map[num] = { num, name: playerMaster[num], totalPt: 0, games: 0, ranks: [0,0,0,0] };
    }
  });

  // 対局データを加算
  games.forEach(g => g.results.forEach(r => {
    const key = r.num;
    if (!map[key]) map[key] = { num: r.num, name: r.name, totalPt: 0, games: 0, ranks: [0,0,0,0] };
    map[key].totalPt += r.pt;
    map[key].games += 1;
    map[key].ranks[r.rank - 1] += 1;
    map[key].name = r.name; // 最新のマスタ名を反映
  }));

  return Object.values(map).map(p => ({
    ...p,
    totalPt: Math.round(p.totalPt * 10) / 10,
    avgRank: p.games > 0 ? Math.round((p.ranks.reduce((s, c, i) => s + c * (i+1), 0) / p.games) * 100) / 100 : 0,
    rates: p.ranks.map(c => p.games > 0 ? Math.round((c / p.games) * 1000) / 10 : 0)
  })).sort((a, b) => {
    // 対局中の人が先、その中で pt 降順、対局なしは番号順で最後
    if (a.games === 0 && b.games === 0) return a.num - b.num;
    if (a.games === 0) return 1;
    if (b.games === 0) return -1;
    return b.totalPt - a.totalPt;
  });
}

function getTodayGames(games) {
  const today = new Date();

  const m = today.getMonth();

  return games.filter(g => {
    const gd = new Date(g.gameDate || g.timestamp);
    return gd.getFullYear() === y && gd.getMonth() === m && gd.getDate() === d;
  });
}

// 卓組みセクション(選手マスタの卓番情報 + 対局済み判定)
function renderPlayerTables(num, playerGames) {
  const tables = playerTables[num] || {};
  const wrap = document.getElementById('playerTablesWrap');
  const roundNums = Object.keys(tables).map(Number).sort((a, b) => a - b);

  if (roundNums.length === 0) {
    wrap.innerHTML = `<div class="tables-empty">卓組みはまだ登録されていません</div>`;
    return;
  }

  // どの回戦が対局済みか(その日の対局結果から判定)
  // gameDateが今日の対局、あるいは全対局のうち古い順から回戦を割り振る
  // 1day運用では「送信された対局のうち、対戦相手が同じ4人だった半荘」を各回戦として扱う
  // シンプルには、playerGamesの数=消化回戦数、時刻順に若い方から1回戦・2回戦...とみなす
  const sortedGames = [...playerGames].sort((a, b) => a.timestamp - b.timestamp);
  const playedRoundCount = sortedGames.length;

  const slots = roundNums.map(round => {
    const taku = tables[round];
    const isDone = round <= playedRoundCount;
    const isPending = !isDone;
    const cls = isDone ? 'done' : (isPending ? 'pending' : '');
    return `
      <div class="table-slot ${cls}">
        <div class="round-label">R${round}</div>
        <div class="round-jp">${round}回戦</div>
        <div><span class="table-num">${taku}</span><span class="table-num-suffix">卓</span></div>
      </div>
    `;
  }).join('');

  wrap.innerHTML = `<div class="tables-grid">${slots}</div>`;
}

    if (r.pt < worstPt) worstPt = r.pt;
    if (r.score > bestScore) bestScore = r.score;
    if (r.score < worstScore) worstScore = r.score;
  });
  const avgRank = Math.round((ranks.reduce((s, c, i) => s + c * (i+1), 0) / total) * 100) / 100;

  wrap.innerHTML = `

      <div class="label">3着</div>
      <div class="value">${ranks[2]}</div>
      <div class="sub">${(ranks[2]/total*100).toFixed(0)}%</div>
    </div>
    <div class="player-stat r4">
      <div class="label">4着</div>
      <div class="value">${ranks[3]}</div>
      <div class="sub">${(ranks[3]/total*100).toFixed(0)}%</div>

      <div class="sub">${bestScore.toLocaleString()}点</div>

    <div class="player-stat worst">
      <div class="label">ワースト</div>

function buildCsvUrl(url) {
  const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if (!m) return url;
  const id = m[1];
  const gidMatch = url.match(/[?&#]gid=(\d+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
}

async function loadData(silent = false) {
  const url = document.getElementById('sheetUrl').value.trim();
  const masterUrl = document.getElementById('masterUrl').value.trim();
  const status = document.getElementById('status');

  // どちらも空 → 完全サンプルモード
  if (!url && !masterUrl) {
    playerMaster = {};
    playerTables = {};
    PLAYER_MASTER_SAMPLE.forEach((p, i) => {
      playerMaster[p.num] = p.name;
      const tables = {};
      for (let round = 1; round <= 5; round++) {
        tables[round] = ((i + round * 3) % 4) + 1;
      }
      playerTables[p.num] = tables;
    });
    allRows = SAMPLE_ROWS;
    allGames = processRows(allRows);
    status.textContent = '● サンプルデータ表示中';
    status.style.color = 'var(--ink-mute)';
    document.getElementById('dataInfo').textContent = 'SAMPLE DATA';
    renderCurrentView();
    stopAutoRefresh();
    return;
  }

  try {
    if (!silent) status.textContent = '○ 読込中...';

    // 選手マスタを読み込み(あれば)
    if (masterUrl) {
      const r = await fetch(buildCsvUrl(masterUrl) + '&_=' + Date.now());
      if (!r.ok) throw new Error('選手マスタ読込失敗');
      const parsed = parseMasterCSV(await r.text());
      playerMaster = parsed.nameMap;
      playerTables = parsed.tableMap;
    } else {
      playerMaster = {};
      playerTables = {};
    }

    // スコア記録を読み込み(あれば)
    if (url) {
      const r = await fetch(buildCsvUrl(url) + '&_=' + Date.now());
      if (!r.ok) throw new Error('結果読込失敗');
      allRows = parseCSV(await r.text());
    } else {
      allRows = []; // スコア記録なしモード: 対局は0件
    }
    allGames = processRows(allRows);

    const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const masterCount = Object.keys(playerMaster).length;
    const modeLabel = url ? '' : ' / 対局待機中';
    status.textContent = `● 更新 ${now} (${allRows.length}対局${masterCount > 0 ? ` / 選手 ${masterCount}名` : ''}${modeLabel})`;
    status.style.color = 'var(--bamboo)';
    document.getElementById('dataInfo').textContent = 'GOOGLE SHEETS · ' + allRows.length + ' GAMES';
    renderCurrentView();
    startAutoRefresh();
  } catch (e) {
    status.textContent = '✕ ' + e.message;
    status.style.color = 'var(--accent)';
  }
  document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('ja-JP');
}

function parseMasterCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const nameMap = {};   // 選手番号 → 名前(旧仕様互換)
  const tableMap = {};  // 選手番号 → { 1: 卓番, 2: 卓番, ... }
  for (let i = 1; i < lines.length; i++) {
    // ダブルクォート付きCSVにも対応
    const cols = lines[i].split(',').map(s => s.trim().replace(/^"|"$/g, ''));
    if (cols.length < 2) continue;
    const num = parseInt(cols[0]);
    const name = cols[1];
    if (isNaN(num) || !name) continue;
    nameMap[num] = name;
    // C列以降(cols[2]以降)を回戦別の卓番として読み取る
    const tables = {};
    for (let k = 2; k < cols.length; k++) {
      const t = parseInt(cols[k]);
      if (!isNaN(t) && t > 0) tables[k - 1] = t; // k=2 → 1回戦
    }
    if (Object.keys(tables).length > 0) tableMap[num] = tables;
  }
  return { nameMap, tableMap };
}

// 結果CSV: 対局日, 東家選手番号, 東家点数, 南家選手番号, 南家点数, 西家選手番号, 西家点数, 北家選手番号, 北家点数, 送信日時 (10列)
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(s => s.trim());
    if (cols.length < 10) continue;
    const players = [];
    let valid = true;
    // 東南西北の順に並んでいるので、それぞれを取り出す
    // col[0]=対局日, col[1]=東家num, col[2]=東家score, col[3]=南家num, col[4]=南家score, ...
    const seatNames = ['東', '南', '西', '北'];
    for (let p = 0; p < 4; p++) {
      const base = 1 + p * 2;
      const num = parseInt(cols[base]);
      const score = parseInt(cols[base + 1]);
      if (isNaN(num) || isNaN(score)) { valid = false; break; }
      const name = playerMaster[num] || `#${num}`;
      players.push({ num, name, score, seat: seatNames[p] });
    }
    if (!valid) continue;

    // 対局日(col[0])と送信日時(col[9])を解釈
    // 送信日時の方が時刻情報として確実なので、それをtimestampに採用
    // (対局日は日付のみなので、複数対局の順序が決まらない)
    const gameDateRaw = cols[0];
    const submittedRaw = cols[9];

    let ts = Date.parse(submittedRaw);
    if (isNaN(ts)) ts = Date.parse(gameDateRaw);
    if (isNaN(ts)) ts = i;

    // 表示用の日付は「対局日」を優先(送信日時とずれる可能性があるため)
    let gameDate = Date.parse(gameDateRaw);
    if (isNaN(gameDate)) gameDate = ts;

    rows.push({
      timestamp: ts,
      gameDate: gameDate, // 表示用の日付(対局日)
      players
    });
  }
  return rows;
}

function startAutoRefresh() {
  if (AUTO_REFRESH_MS <= 0) return;
  stopAutoRefresh();
  autoRefreshTimer = setInterval(() => loadData(true), AUTO_REFRESH_MS);
}
function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}

function toggleSource() {
  document.getElementById('sourceDetail').classList.toggle('visible');
  document.getElementById('sourceDetail2').classList.toggle('visible');
}

// ============================================================
// 初期化
// ============================================================
if (DEFAULT_RESULTS_URL || DEFAULT_MASTER_URL) {
  document.getElementById('sheetUrl').value = DEFAULT_RESULTS_URL;
  document.getElementById('masterUrl').value = DEFAULT_MASTER_URL;
  loadData();
} else {
  allRows = SAMPLE_ROWS;
  allGames = processRows(allRows);
  renderCurrentView();
}
</script>
